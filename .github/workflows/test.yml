name: Test

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  shell:
    name: Shell syntax + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CRLF in a .sh is a PARSE ERROR, not a style issue, and it has bitten
      # this repo before: nine scripts were simultaneously unrunnable while
      # looking perfect in an editor and in a GitHub diff. .gitattributes pins
      # *.sh eol=lf; this proves the pin is working on a fresh clone.
      - name: No CRLF in shell scripts
        run: |
          bad=$(find . -name '*.sh' -not -path './.git/*' -not -path './.vs/*' -exec file {} \; | grep CRLF || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "all .sh are LF"

      # Windows PowerShell 5.1 reads a BOM-less .ps1 as the ANSI codepage. A
      # multibyte character then ends a string early and the whole file fails
      # to PARSE - nine installers were in that state while looking perfect in
      # a diff. Non-ASCII requires a BOM; pure ASCII may go without.
      - name: Every non-ASCII .ps1 carries a UTF-8 BOM
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.ps1"):
              if ".git" in p.parts: continue
              b = p.read_bytes()
              if any(x > 127 for x in b) and not b.startswith(b"\xef\xbb\xbf"):
                  bad.append(str(p))
          if bad:
              print("non-ASCII without a BOM (5.1 will misparse):"); print("\n".join(bad)); sys.exit(1)
          print("every non-ASCII .ps1 has a BOM")
          PY

      # The two things node prep cannot undo and the one place it downloads
      # binaries from, exercised against a fake release served from a folder.
      - name: prebuilt staging verifies against the release index
        run: bash SerenStarwright/nodes/tests/test-prebuilts-fetch.sh

      - name: --local installs from a dev wheelhouse (real pip, no network)
        run: bash SerenStarwright/services/tests/test-local-wheelhouse.sh

      - name: every install is recorded in the ledger (no token in it)
        run: bash SerenStarwright/services/tests/test-install-record.sh

      - name: a card reads a sibling's config for its url and bearer (no token on argv)
        run: bash SerenStarwright/services/tests/test-sibling-config.sh

      - name: a reinstall keeps what the card does not write
        run: bash SerenStarwright/services/tests/test-keep-config.sh

      - name: --root puts a named install in one folder, absolute paths
        run: bash SerenStarwright/services/tests/test-install-root.sh

      - name: bash -n every script
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './.vs/*')
          exit $fail

      # --describe must be valid JSON with ZERO side effects. Run it in a
      # throwaway HOME and assert nothing was created - a "describe" that
      # installs something is not a describe.
      - name: services --describe is valid JSON and side-effect free
        run: |
          export HOME=$(mktemp -d)
          for f in SerenStarwright/services/bash/seren-*-setup.sh; do
            bash "$f" --describe
          done > described.jsonl
          # Python opens the file itself. `python3 - <<'PY' < file` sends BOTH
          # the heredoc and the file to stdin, the file wins, and Python tries
          # to execute the JSON as source ("name 'true' is not defined").
          python3 - <<'PY'
          import json
          rows = [json.loads(l) for l in open("described.jsonl") if l.strip()]
          assert rows, "no services described"
          req = {"schema_version", "name", "display", "description", "group",
                 "package", "default_host", "default_port", "extras", "flags",
                 "requires", "accent", "switches"}
          for d in rows:
              # a switch is a flag; --no-updates is one on every card
              assert set(d["switches"]) <= set(d["flags"]), "%s: switches not in flags" % d["name"]
              assert "no-updates" in d["switches"], "%s: no-updates missing from switches" % d["name"]
          for d in rows:
              missing = req - set(d)
              assert not missing, "%s: missing %s" % (d.get("name"), sorted(missing))
          print("%d services, all keys present" % len(rows))
          PY
          created=$(find "$HOME" -mindepth 1 | wc -l)
          [ "$created" -eq 0 ] || { echo "--describe created $created path(s)"; exit 1; }
          echo "zero side effects"

      - name: node --describe for every platform
        run: |
          for p in xavier nano spark; do
            bash SerenStarwright/nodes/seren-prepare-node.sh --describe --platform "$p" > node.json
            python3 - <<'PY'
          import json
          d = json.load(open("node.json"))
          assert d["flags"], "node describe advertises no flags"
          assert d["components"], "node describe lists no components"
          # Prep and rename are opt-in, and the TUI renders its prep checkbox and
          # rename field ONLY if these are advertised. Losing them turns the
          # screen back into one that always preps and derives a hostname.
          for f in ("prep", "no-prep", "rename"):
              assert f in d["flags"], "node describe lost '%s'" % f
          # -H/--hostname is rejected from the catch-all precisely so it does NOT
          # appear here. If it comes back, the TUI renders the auto-derive input
          # whose blank default renamed a box mid-install.
          assert "hostname" not in d["flags"], "retired 'hostname' is advertised again"
          for k in ("provisioned", "provisioned_at", "hostname_managed"):
              assert k in d, "node describe is missing '%s'" % k
          print("%s: %d components, %d flags, provisioned=%s"
                % (d["platform"], len(d["components"]), len(d["flags"]),
                   d["provisioned"]))
          PY
          done

      # A component install must not be able to rename the box. The dispatcher
      # refuses the retired flag outright rather than quietly ignoring it, so
      # any script or runbook still passing it FAILS LOUDLY instead of renaming.
      - name: retired --hostname is refused, not ignored
        run: |
          cd SerenStarwright
          if bash nodes/seren-prepare-node.sh --platform nano -l --hostname boom >out.txt 2>&1; then
            echo "--hostname was ACCEPTED - a component install can still rename:"
            cat out.txt
            exit 1
          fi
          grep -q -- "--rename" out.txt || { echo "rejection does not point at --rename:"; cat out.txt; exit 1; }
          echo "refused, and it names the replacement"

      # Nothing-to-do must stay an error, and --prep alone must stay valid: the
      # arg gate was "at least one component" back when a component was the only
      # thing you could ask for.
      - name: --prep alone is a valid request
        run: |
          cd SerenStarwright
          bash nodes/seren-prepare-node.sh --describe --platform nano >/dev/null
          if bash nodes/seren-prepare-node.sh --platform nano >out.txt 2>&1; then
            echo "no arguments was accepted; it should be an error"; cat out.txt; exit 1
          fi
          grep -q "Nothing to do" out.txt || { echo "wrong error for no args:"; cat out.txt; exit 1; }
          echo "no-args refused with the right message"

  powershell:
    # verify-powershell.ps1 existed and was never run by CI, so "the PowerShell
    # side works" was a claim nobody had checked since it was written. This
    # runs it under BOTH engines a Windows user might have: Windows PowerShell
    # 5.1 (powershell.exe, the strict one) and PowerShell 7 (pwsh).
    name: PowerShell installers (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: verify-powershell.ps1
        shell: ${{ matrix.shell }}
        run: |
          & "$env:GITHUB_WORKSPACE\SerenStarwright\verify-powershell.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  tui:
    name: TUI suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --quiet textual
      # Drives the real TUI headless through Textual's pilot - real clicks,
      # real rendered geometry. Includes the 80-column layout checks, which
      # is the terminal size that actually matters here.
      - run: python3 SerenStarwright/test-starwright.py

  bundle:
    name: One-file bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash SerenStarwright/build-starwright.sh --out dist/starwright.pyz
      # The build script's pure-Python guard is the real gate: zipapp cannot
      # load a C extension from inside an archive, so a compiled dependency
      # sneaking into the tree must fail the build rather than ship an archive
      # that explodes on someone's Jetson.
      - name: Runs standalone with nothing installed
        run: |
          python3 -c 'import textual' 2>/dev/null && { echo "textual leaked into the runner env - test is void"; exit 1; }
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/dist/starwright.pyz" .
          python3 starwright.pyz --dump | tee out.txt
          grep -q seren- out.txt || { echo "bundle discovered nothing"; exit 1; }
          echo "bundle works with no checkout and no textual"
